				<!DOCTYPE html>
				<html>
				<head>
					<meta charset="utf-8">
					<meta name="viewport" content="width=device-width, initial-scale=1">
					<title>Practica III</title>

					<style>
			    body {
			      background-image: url('img/backgroundd.jpg');
			      background-repeat: no-repeat; /* Evita que se duplique */
			      background-size: cover;       /* Ajusta la imagen al tamaño de la pantalla */
			      background-attachment: fixed; /* Deja el fondo fijo al hacer scroll */
			      background-position: center;

			    }
			    table{
			    	width: 100px;
			    	height: 100px;
			    	margin-right: auto;
			    	margin-left: auto;
			    	background-color: transparent;

			    	border-collapse: separate;
			    	border-spacing: 15px;

			    	margin-top: 19vh;
			    }
			    td{
			    	background-color: transparent;
			    	width:40px;
			    	height:40px;
			    	text-align:center;
			    	
			    }
			    td a{
			    display: flex;             /* Activa el modo flexible */
			    flex-direction: column;    /* Pone la imagen arriba y el número abajo */
			    justify-content: center;   /* Centra verticalmente */
			    align-items: center;       /* Centra horizontalmente */
			    
			    width: 100%;
			    height: 100%;
			    text-decoration: none;
			    color: black;
			    font-weight: bold;
			    }
			    td img {
				    width: 200px;  /* Ajusta este tamaño al gusto */
				    height: auto;
				    margin-bottom: 5px; /* Da un pequeño respiro entre la imagen y el número */
				}
				.boton-numero {
			    background-color: #006241; /* Verde estilo Starbucks */
			    color: white;              /* Texto blanco */
			    padding: 5px 20px;         /* Espacio alrededor del número */
			    border-radius: 20px;       /* Bordes redondos*/
			    font-size: 20px;           /* Tamaño del número */
			    margin-top: 10px;          /* Separación de la imagen */

			}
						  </style>
				</head>
				<body>
					<center>
						
						<img src="img/starb.png">
					</center>
					<table>
						<tr>
							<td>
								<a href="index2.html">
								<span class="boton-numero">1</span>
								<img src="img/coffe.png">
							</a>
							</td>
							<td>
								<a href="index2.html">
								<span class="boton-numero">2</span>
								<img src="img/pan.png">
							</a>
							</td>
							<td>
								<a href="index2.html">
								<span class="boton-numero">3</span>
								<img src="img/Cgrano.png">
							</a>
							</td>
						</tr>
					</table>

				</body>
				</html>
